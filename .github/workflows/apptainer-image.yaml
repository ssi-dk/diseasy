name: Export Apptainer container for HPC

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Development image tag"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Pull development image
        run: |
          IMAGE="ghcr.io/ssi-dk/diseasy:${{ inputs.image_tag }}"

          docker pull --platform linux/amd64 "$IMAGE"

          echo "DEV_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Verify Docker image
        run: |
          docker run --rm \
            --entrypoint Rscript \
            "$DEV_IMAGE" \
            -e '
              cat("diseasy version: ",
                  as.character(packageVersion("diseasy")),
                  "\n",
                  sep = "")
              cat("Source ref: ", Sys.getenv("DISEASY_SOURCE_REF"), "\n")
              cat("Source SHA: ", Sys.getenv("DISEASY_SOURCE_SHA"), "\n")
            '

      - name: Install Apptainer
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt update
          sudo apt install -y apptainer

          apptainer version

      - name: Create SIF
        run: |
          DATE=$(date -u +%Y-%m-%d)

          SOURCE_SHA=$(docker inspect \
            --format '{{index .Config.Env}}' \
            "$DEV_IMAGE")

          SHA=$(docker run --rm \
            --entrypoint sh \
            "$DEV_IMAGE" \
            -c 'printf "%.7s" "$DISEASY_SOURCE_SHA"')

          SIF_NAME="diseasy-${DATE}-${SHA}.sif"

          apptainer build \
            "$SIF_NAME" \
            "docker-daemon:${DEV_IMAGE}"

          echo "SIF_NAME=$SIF_NAME" >> "$GITHUB_ENV"

      - name: Verify SIF
        run: |
          ls -lh "$SIF_NAME"

          apptainer inspect "$SIF_NAME"

          apptainer exec "$SIF_NAME" \
            Rscript -e '
              cat("diseasy version: ",
                  as.character(packageVersion("diseasy")),
                  "\n",
                  sep = "")
              cat("Source ref: ", Sys.getenv("DISEASY_SOURCE_REF"), "\n")
              cat("Source SHA: ", Sys.getenv("DISEASY_SOURCE_SHA"), "\n")
            '

      - name: Upload SIF
        uses: actions/upload-artifact@v4
        with:
          name: diseasy-apptainer-${{ inputs.image_tag }}
          path: ${{ env.SIF_NAME }}
          retention-days: 7
